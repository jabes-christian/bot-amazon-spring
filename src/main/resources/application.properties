spring.application.name=bot-amazon-spring
spring.config.import=optional:file:.env[.properties]
# Sem default de dev local (correcao durante T2, ver tasks.md de operacao-docker): um
# default nao-vazio aqui tornaria o fail-fast do RequiredEnvironmentValidator (OPS-11)
# um no-op para estas 3 chaves - a app sempre "acharia" um valor e so falharia depois,
# com um erro JDBC de conexao recusada em vez da mensagem clara do validator.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
# Mesmo motivo do bloco acima: o relaxed binding de env var (TELEGRAM_BOT_TOKEN ->
# telegram.bot.token) so funciona quando a variavel vem do ambiente real do SO/container
# (SystemEnvironmentPropertySource) - nao quando vem de um arquivo carregado via
# spring.config.import (.env em dev local), que vira uma property source comum sem essa
# conversao automatica de nome. Sem estas pontes, RequiredEnvironmentValidator (OPS-11)
# acusa estas 7 chaves como ausentes mesmo com o .env preenchido. Sem default nao-vazio,
# pelo mesmo motivo do bloco acima (nao neutralizar o fail-fast).
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
evolution.api.url=${EVOLUTION_API_URL:}
evolution.api.key=${EVOLUTION_API_KEY:}
evolution.api.instance=${EVOLUTION_API_INSTANCE:}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:}
afiliado.tag=${AFILIADO_TAG:}
# ddl-auto=validate faz o boot falhar (fail-fast) se o schema real divergir do que as
# migrations Flyway definem - inclusive quando existe uma migration pendente ainda nao
# aplicada, o schema fica "atrasado" em relacao ao codigo e o validate rejeita a subida
# (OPS-19). Comportamento nativo da combinacao Flyway + ddl-auto=validate, sem codigo
# proprio - coberto indiretamente por BotAmazonSpringApplicationIT (uma migration
# pendente nunca apareceria em flyway_schema_history como aplicada).
spring.jpa.hibernate.ddl-auto=validate
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

# Cron do ciclo de coleta (fuso America/Sao_Paulo) - padrao: uma vez ao dia, as 06:00.
# Decisao operacional (nao e limiar de negocio - ver design.md de canais-disparo, Tech Decisions),
# ajustavel via variavel de ambiente sem tocar em app_config.
coleta.cron=0 0 6 * * *

# Cron do ciclo de disparo (fuso America/Sao_Paulo) - padrao: uma vez ao dia, as 09:00
# (apos a coleta das 06:00, dando margem para o ciclo de coleta terminar).
# Mesma natureza operacional de coleta.cron - ver design.md de canais-disparo, Tech Decisions.
disparo.cron=0 0 9 * * *
